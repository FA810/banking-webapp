apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankingwebapp
  labels:
    app: bankingwebapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bankingwebapp
  template:
    metadata:
      labels:
        app: bankingwebapp
    spec:
      # Init Container 1: Waits for Postgres to be ready
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'echo Waiting for Postgres...; until nc -z postgres 5432; do echo waiting...; sleep 5; done;']
        
        # Init Container 2: Waits for Kafka KRaft to be ready
        - name: wait-for-kafka
          image: busybox:1.36
          # Updated to target the new service name 'kafka-kraft'
          command: ['sh', '-c', 'echo Waiting for Kafka KRaft...; until nc -z kafka-kraft 9092; do echo waiting...; sleep 5; done;']
          
      containers:
        - name: bankingwebapp-container
          image: bankingwebapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # =========================================================
            # POSTGRES CONFIGURATION
            # =========================================================
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/banking_app"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            
            # =========================================================
            # KAFKA (KRaft) CONFIGURATION - New dependency
            # =========================================================
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-kraft:9092"
            - name: KAFKA_BOOTSTRAP_SERVERS # Alias for backward compatibility
              value: $SPRING_KAFKA_BOOTSTRAP_SERVERS

          resources:
            limits:
              memory: "1024Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bankingwebapp-service
spec:
  selector:
    app: bankingwebapp
  type: NodePort
  ports:
    - protocol: TCP
      port: 8080        # Service Port (internal to the cluster)
      targetPort: 8080    # Port exposed by the Container
      nodePort: 30080     # Port exposed on the Host (accessible via localhost:30080)