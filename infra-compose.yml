services:
  # -----------------------------
  # PostgreSQL Database Service
  # -----------------------------
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: bankingdb             # Database name
      POSTGRES_USER: postgres           # Default user
      POSTGRES_PASSWORD: Welcome        # User password
    ports:
      - "5432:5432"                     # Expose Postgres port (host:container)
    networks:
      - appnet
    healthcheck:                        # Check if Postgres is ready
      test: ["CMD-SHELL", "pg_isready -U postgres -d bankingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Zookeeper (required by Kafka)
  # -----------------------------
  zookeeper:
    image: zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: 'yes'      # Allow unauthenticated access (for local dev only)
    ports:
      - "2181:2181"                     # Zookeeper client port
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # -----------------------------
  # Kafka Broker
  # -----------------------------
  kafka:
    image: ubuntu/kafka:latest
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      ALLOW_PLAINTEXT_LISTENER: 'yes'
      
    ports:
      - "29092:29092"
    
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - appnet

  # -----------------------------
  # Kafka UI (Web interface)
  # -----------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: local             # Name displayed in UI
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092  # Kafka broker connection
    ports:
      - "8081:8080"                         # Web UI available on localhost:8081
    networks:
      - appnet

# -----------------------------
# Shared network for all services
# -----------------------------
networks:
  appnet:
    name: appnet