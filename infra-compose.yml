services:
  # -----------------------------
  # PostgreSQL Database Service
  # -----------------------------
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: banking_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Kafka Broker (Switched to KRaft: no Zookeeper required)
  # -----------------------------
  kafka-kraft:
    image: apache/kafka:3.9.1

    # KAFKA_CFG_* are no longer used with the standard Apache image.
    # We will use the environment variables provided by the Apache image (similar to K8s).
    environment:
      # Minimal KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-kraft:9093' # Use the new service name
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://kafka-kraft:9093
      KAFKA_CLUSTER_ID: '5L6g3nShT-eMCtK--X86sw' # Use the same ID as the K8s YAML
      KAFKA_LOG_DIRS: /tmp/kraft-storage
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Necessary to start the server (which includes formatting if it doesn't exist)
      KAFKA_SERVER_STARTUP_TIMEOUT_MS: 180000

    ports:
      # Exposing 9092 instead of 29092 for simplicity
      - "9092:9092"

    networks:
      - appnet

  # -----------------------------
  # Kafka UI (Web interface)
  # -----------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka-kraft:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-kraft:9092
    ports:
      - "8081:8080"
    networks:
      - appnet

# -----------------------------
# Shared network for all services
# -----------------------------
networks:
  appnet:
    name: appnet