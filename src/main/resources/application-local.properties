# =================================================================
# SPRING BOOT LOCAL DEVELOPMENT PROFILE
# =================================================================

# --- DATABASE CONFIGURATION ---
# Use 'localhost' because IntelliJ runs on the host OS, not inside the Docker network.
# Docker service name 'postgres' is only reachable from other containers.
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_app
spring.datasource.username=postgres
spring.datasource.password=postgres

# Changed to 'update' to persist your test data between CSS/Java changes.
# 'create' would wipe the database every time DevTools restarts the app.
spring.jpa.hibernate.ddl-auto=update

# --- KAFKA CONFIGURATION ---
# Points to the Kafka broker exposed on your local machine via Docker ports.
spring.kafka.bootstrap-servers=localhost:9092

# --- FRONTEND RAPID DEVELOPMENT (HOT RELOAD) ---
# Disables Thymeleaf template caching so HTML changes are visible immediately.
spring.thymeleaf.cache=false
# Disables static resource caching (CSS/JS) for instant updates on refresh.
spring.web.resources.cache.period=0

# --- DEBUGGING ---
# Formats and prints SQL queries to the console for easier troubleshooting.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true