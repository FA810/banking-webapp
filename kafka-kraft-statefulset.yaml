# kafka-kraft-statefulset.yaml (Uses a StatefulSet and Persistent Storage)

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-kraft # Service name: MUST remain the same
  labels:
    app: kafka-kraft
spec:
  # MUST BE PRESENT: Headless Service
  clusterIP: None
  ports:
    - port: 9092
      targetPort: 9092
  selector:
    app: kafka-kraft
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-kraft
spec:
  selector:
    matchLabels:
      app: kafka-kraft
  serviceName: "kafka-kraft"
  replicas: 1 # Starting with 1 for simplicity, but 3 are needed in a real environment.
  template:
    metadata:
      labels:
        app: kafka-kraft
    spec:
      # FUNDAMENTAL ADDITION: Ensures the volume filesystem group is 1000
      # This is the group ID used by the Kafka user inside the container.
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: format-kraft
          image: apache/kafka:3.9.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              KAFKA_CLUSTER_ID="5L6g3nShT-eMCtK--X86sw"
              KAFKA_LOG_DIRS="/var/lib/kafka/data"
              CONFIG_FILE="/tmp/server.properties"
              
              # 1. Create the TEMPORARY configuration file required by kafka-storage.sh
              echo "log.dirs=$KAFKA_LOG_DIRS" > $CONFIG_FILE
              echo "node.id=1" >> $CONFIG_FILE
              echo "process.roles=controller,broker" >> $CONFIG_FILE
              echo "controller.quorum.voters=1@kafka-kraft:9093" >> $CONFIG_FILE
              
              # FUNDAMENTAL ADDITIONS: Listener and Controller Listener Names
              echo "listeners=PLAINTEXT://:9092,CONTROLLER://:9093" >> $CONFIG_FILE
              echo "controller.listener.names=CONTROLLER" >> $CONFIG_FILE
              
              # 2. Check and format
              if [ ! -f "$KAFKA_LOG_DIRS/meta.properties" ]; then
                echo "Formatting KRaft directory with Cluster ID $KAFKA_CLUSTER_ID..."
                /opt/kafka/bin/kafka-storage.sh format \
                  --cluster-id $KAFKA_CLUSTER_ID \
                  --config $CONFIG_FILE
              else
                echo "KRaft directory already formatted. Skipping formatting."
              fi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"  
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"  
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-kraft-0.kafka-kraft:9092,CONTROLLER://kafka-kraft-0.kafka-kraft:9093"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-kraft-0.kafka-kraft:9093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data" # Updated path
            - name: KAFKA_CLUSTER_ID
              value: "5L6g3nShT-eMCtK--X86sw"
            # FUNDAMENTAL UPDATE: Adds the protocol for the CONTROLLER listener
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            # FUNDAMENTAL ADDITION (the missing variable):
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            limits:
              memory: "1024Mi"
  # Persistent Volume Claim Definition
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi # Persistent space request